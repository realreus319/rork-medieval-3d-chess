name: Trigger Xiangqi Refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/xiangqi-refactor-trigger.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xiangqi-gameshell-elephant-rules
          fetch-depth: 0

      - name: Apply rendering patch
        run: python3 scripts/patch_xiangqi.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Xiangqi tests
        working-directory: web
        run: npx vitest run src/xiangqi/core.test.ts src/xiangqi/coordinates.test.ts src/xiangqi/cinematicController.test.ts src/xiangqi/i18n.test.ts src/xiangqi/aiClient.test.ts

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src
          git commit -m "feat: add distinct elephant visuals and verify Xiangqi rules" || true
          git push origin HEAD:feat/xiangqi-gameshell-elephant-rules
